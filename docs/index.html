<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Safra</title>
<meta name="description" content="Minha adega de vinhos, ligada ao Notion.">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Safra">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="login" class="gate" hidden>
  <img src="icons/icon-192.png" alt="">
  <h1>Safra</h1>
  <p>Abra o app pelo seu link pessoal. Depois disso ele fica salvo neste aparelho.</p>
  <form id="loginForm">
    <input id="pin" type="password" autocomplete="current-password" placeholder="ou digite a senha">
    <button class="btn primary big" type="submit">Entrar</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>
</section>

<div id="app" class="app" hidden>
  <div class="sbar"></div>
  <main>
    <header class="head">
      <div class="top">
        <div class="top-t"><h1 id="viewTitle">Adega</h1><div class="sub" id="viewSub"></div></div>
        <div class="hbtns">
          <button class="round glass" id="bellBtn" type="button" aria-label="Avisos no celular"><svg class="i" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20a2 2 0 0 0 4 0"/></svg></button>
          <button class="round glass" id="syncBtn" type="button" aria-label="Atualizar do Notion"><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg></button>
          <button class="round accent" id="newBtn" type="button" aria-label="Nova garrafa"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </div>
    </header>
    <section id="v-adega" class="view"></section>
    <section id="v-abrir" class="view" hidden></section>
    <section id="v-mapa" class="view" hidden></section>
    <section id="v-num" class="view" hidden></section>
  </main>

  <nav class="tabbar glass" aria-label="Seções">
    <button data-v="adega" class="on"><svg class="i" viewBox="0 0 24 24"><path d="M8 2h8M9.5 2v4.5c0 1.6-3.5 2.6-3.5 6.5v7.5a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5V13c0-3.9-3.5-4.9-3.5-6.5V2"/><path d="M6 15h12"/></svg>Adega</button>
    <button data-v="abrir"><svg class="i" viewBox="0 0 24 24"><path d="M7 3h10c0 5-1.5 8-5 8s-5-3-5-8z"/><path d="M12 11v8M8 21h8"/></svg>Abrir</button>
    <button data-v="mapa"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>Posições</button>
    <button data-v="num"><svg class="i" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Números</button>
  </nav>
</div>

<div id="sheetBg" class="sheetbg" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden>
  <div class="grip" aria-hidden="true"></div>
  <div id="sheetBody"></div>
</div>
<div id="toast" class="toast glass" role="status" aria-live="polite"></div>
<button id="outbox" class="outbox glass" type="button" hidden></button>

<script type="module" src="app.js"></script>
</body>
</html>
