<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1d2a"/>
      <stop offset="1" stop-color="#140910"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#b8325a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b8325a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2486f"/>
      <stop offset="0.6" stop-color="#a51d45"/>
      <stop offset="1" stop-color="#6e0f2c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f1e4dc" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-20%" width="180%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <!-- bojo em tulipa: mais largo embaixo, fechando na boca -->
    <path id="bowlp" d="M372 200 H652 C700 300 712 420 676 500 C640 576 584 606 512 610 C440 606 384 576 348 500 C312 420 324 300 372 200 Z"/>
    <clipPath id="bowl"><use href="#bowlp"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g filter="url(#sh)">
    <use href="#bowlp" fill="url(#glass)"/>
    <g clip-path="url(#bowl)">
      <path d="M290 400 C390 378 450 420 520 410 C600 398 660 376 740 392 V660 H290 Z" fill="url(#wine)"/>
      <path d="M290 400 C390 378 450 420 520 410 C600 398 660 376 740 392" fill="none" stroke="#ff9db5" stroke-opacity=".7" stroke-width="9"/>
    </g>
    <rect x="497" y="600" width="30" height="180" rx="13" fill="url(#glass)"/>
    <ellipse cx="512" cy="800" rx="142" ry="30" fill="url(#glass)"/>
    <path d="M396 246 C376 320 378 400 404 462" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>
